# .gitlab-ci.yml — mino/learnhouse — Mode B (CI build+push → webhook Coolify)
# Dérivé du template vault `11-references/templates/gitlab-ci-docker-image.md`
# (Pattern A/C, 1 image) — monorepo, Dockerfile racine, image unique.
# Branche d'exploitation : `hiha` (au lieu de `main` du template).
#
# ÉCART ASSUMÉ VS LE PARC — le registre est Docker Hub, pas registry.hi-ha.be.
# `registry.hi-ha.be` est derrière un CF Tunnel : Cloudflare Free/Pro plafonne
# à 100 Mo par couche et le mode DNS-only est impossible (piège vault DR32).
# Quatre couches de cette image dépassent la limite (663 / 486 / 168 / 108 Mo,
# mesuré par `docker history`) : apt (nginx+node+pm2+bun+build-essential),
# `uv sync`, la copie du build Next.js standalone, et la base Debian amont.
# Les leviers de DR32 (élagage des devDependencies, pas de cache registry) ont
# été taillés pour une image Node ; ici même −200 Mo par couche en laisserait
# trois au-dessus du plafond. Docker Hub n'est pas derrière Cloudflare et
# n'impose aucune limite de couche. GitLab reste la source du déploiement et
# le déclencheur.
#
# Le dépôt `hihabe/learnhouse` est PRIVÉ (licence Pro : dépôts privés illimités).
# Le VPS s'authentifie donc au pull, avec un jeton Read seul — voir
# PROCEDURE-DOCKERHUB-OPERATEUR.md. L'AGPL art. 13 n'en souffre pas : elle exige
# d'offrir la *source* (miroir public github.com/sanma88/learnhouse), pas le binaire.
#
# Variables CI à créer (Settings → CI/CD → Variables, Masked + Protected) :
#   DOCKERHUB_USER       — `hihabe`
#   DOCKERHUB_TOKEN      — jeton d'accès Docker Hub, permission **Write**.
#                          Un jeton distinct, en lecture seule, sert au VPS.
#   COOLIFY_API_TOKEN    — token mutualisé `coolify-ci-deploy`
#   COOLIFY_WEBHOOK_URL  — URL de déploiement de la ressource Coolify

variables:
  # Docker Hub exige un chemin entièrement en minuscules.
  REGISTRY_HOST: "docker.io"
  REGISTRY_NS: "hihabe/learnhouse"
  IMAGE_NAME: "${REGISTRY_NS}"
  IMAGE_TAG: "latest"

stages:
  - build
  - deploy

build:
  stage: build
  # IMPORTANT — image: docker:27 (CLI seul), PAS docker:27-dind (daemon).
  # Le runner Sanfilippo monte /var/run/docker.sock dans le container (DR31) —
  # le CLI parle directement au daemon Docker du host. Pas de services: dind.
  image: docker:27
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login "$REGISTRY_HOST" -u "$DOCKERHUB_USER" --password-stdin
  script:
    # --driver docker-container : BuildKit dédié ; garde un cache local entre
    # builds sur le même runner. Pas de --cache-to=type=registry : Docker Hub
    # l'accepterait désormais (la contrainte DR32 tombe avec Cloudflare), mais
    # on ne change qu'une variable à la fois — à envisager après la preuve.
    - docker buildx create --use --name ci --driver docker-container || docker buildx use ci
    # --provenance=false --sbom=false : c'était une obligation Cloudflare
    # (manifeste d'attestation ré-encodé → failed size validation). Conservés
    # ici par choix : un manifeste mono-plateforme, c'est exactement ce que
    # Coolify tire, sans index OCI intermédiaire.
    # LEARNHOUSE_PUBLIC=true : build communautaire (retire /app/api/ee),
    # même build-arg que le workflow GitHub officiel build-community.yaml.
    - >
      docker buildx build --push
      --provenance=false --sbom=false
      --build-arg LEARNHOUSE_PUBLIC=true
      -t ${REGISTRY_HOST}/${IMAGE_NAME}:${IMAGE_TAG}
      -t ${REGISTRY_HOST}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
      .
  rules:
    - if: $CI_COMMIT_BRANCH == "hiha"

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl
  script:
    # Quoted: the "Authorization: Bearer" header contains a colon-space, which YAML
    # reads as a mapping in an unquoted sequence item. GitLab then rejects the whole
    # file ("script config should be a string"), producing a 0-job pipeline.
    - 'curl -fsSL -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$COOLIFY_WEBHOOK_URL"'
  rules:
    - if: $CI_COMMIT_BRANCH == "hiha"
  needs: ["build"]
